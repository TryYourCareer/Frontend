<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/assets/logo/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="light dark" />

  <!-- Primary Meta Tags -->
  <title>Try Your Careers | AI-Powered Career Guidance & Exploration Platform</title>
  <meta name="title" content="Try Your Careers | AI-Powered Career Guidance & Exploration Platform" />
  <meta name="description" content="Discover your ideal career path with AI-driven assessments, salary insights, interactive industry roadmaps, and real-world career reality checks." />
  <meta name="keywords" content="career guidance, career exploration, AI career assessment, job roadmaps, tech careers, student career planner, career reality check, high paying careers, job trends" />
  <meta name="author" content="Try Your Careers" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://tryyourcareer.com/" id="canonical-url" />

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Try Your Careers" />
  <meta property="og:url" content="https://tryyourcareer.com/" />
  <meta property="og:title" content="Try Your Careers | AI-Powered Career Guidance & Exploration" />
  <meta property="og:description" content="Discover your ideal career path with AI-driven assessments, salary insights, interactive industry roadmaps, and real-world career reality checks." />
  <meta property="og:image" content="%PUBLIC_URL%/career_discovery.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Try Your Careers Platform Preview" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://tryyourcareer.com/" />
  <meta name="twitter:title" content="Try Your Careers | AI-Powered Career Guidance & Exploration" />
  <meta name="twitter:description" content="Discover your ideal career path with AI-driven assessments, salary insights, interactive industry roadmaps, and real-world career reality checks." />
  <meta name="twitter:image" content="%PUBLIC_URL%/career_discovery.png" />
  <meta name="twitter:creator" content="@tryyourcareer" />

  <!-- Apple Touch & Mobile Configuration -->
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/assets/logo/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TryYourCareer" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Preconnect & DNS-Prefetch for Speed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- JSON-LD Structured Data (Organization & WebSite Schema) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://tryyourcareer.com/#organization",
          "name": "Try Your Careers",
          "url": "https://tryyourcareer.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://tryyourcareer.com/assets/logo/icon-512.png",
            "width": 512,
            "height": 512
          },
          "description": "AI-driven career assessment, discovery, and roadmap platform for students and job seekers.",
          "sameAs": [
            "https://twitter.com/tryyourcareer",
            "https://linkedin.com/company/tryyourcareer"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://tryyourcareer.com/#website",
          "url": "https://tryyourcareer.com/",
          "name": "Try Your Careers",
          "publisher": {
            "@id": "https://tryyourcareer.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://tryyourcareer.com/career-search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run Try Your Careers.</noscript>
  <div id="root"></div>
</body>

</html>
